[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-batching"
version = "0.1.0"
description = "SceneCraft 分批 Agent 调用引擎：分批 + 批内校验 + 共用重试预算 + 截断诊断"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
