[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-prompt"
version = "0.1.0"
description = "SceneCraft 提示词工程：按场景分批的 prompt 输入构建 + 批次合并"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sc-batching"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
