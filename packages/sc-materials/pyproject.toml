[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-materials"
version = "0.1.0"
description = "SceneCraft 素材卡库：frontmatter 解析 + tag 筛选 + 版权闸 + 预算截断"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc_materials = ["templates/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
